name: boarded-supabase
services:
  db:
    image: supabase/postgres:17.6.1.136@sha256:2f0c2f063d44b71a3e18f7a9756cf734b22b27e194a0fef44c90f0c32198e156
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
      POSTGRES_DB: postgres
      JWT_SECRET: "${JWT_SECRET:?required}"
      JWT_EXP: "${JWT_EXPIRY:-3600}"
      AUTHENTICATOR_DB_PASSWORD: "${AUTHENTICATOR_DB_PASSWORD:?required}"
      SUPABASE_AUTH_ADMIN_PASSWORD: "${SUPABASE_AUTH_ADMIN_PASSWORD:?required}"
      SUPABASE_STORAGE_ADMIN_PASSWORD: "${SUPABASE_STORAGE_ADMIN_PASSWORD:?required}"
      SUPABASE_FUNCTIONS_ADMIN_PASSWORD: "${SUPABASE_FUNCTIONS_ADMIN_PASSWORD:?required}"
      PGBOUNCER_PASSWORD: "${PGBOUNCER_PASSWORD:?required}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./upstream/docker/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./init/99-role-passwords.sql:/docker-entrypoint-initdb.d/init-scripts/99-z-role-passwords.sql:ro
      - ./upstream/docker/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./upstream/docker/volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./upstream/docker/volumes/db/init/data.sql:/docker-entrypoint-initdb.d/migrations/99-data.sql:ro
  auth:
    image: supabase/gotrue:v2.189.0@sha256:909b61a6d17f7d54f88fe649432a6e5de0c5c23795389cb94d876ba7f38f3d9a
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "${API_EXTERNAL_URL:?required}"
      GOTRUE_SITE_URL: "${SITE_URL:?required}"
      GOTRUE_URI_ALLOW_LIST: "${ADDITIONAL_REDIRECT_URLS:-}"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${SUPABASE_AUTH_ADMIN_PASSWORD}@db:5432/postgres"
      GOTRUE_JWT_SECRET: "${JWT_SECRET:?required}"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "${JWT_EXPIRY:-3600}"
      GOTRUE_DISABLE_SIGNUP: "${DISABLE_SIGNUP:-false}"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "${ENABLE_EMAIL_SIGNUP:-true}"
      GOTRUE_MAILER_AUTOCONFIRM: "${ENABLE_EMAIL_AUTOCONFIRM:-false}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
  rest:
    image: postgrest/postgrest:v14.12@sha256:7f2c1b7fc47ff63e7e641ea9bc8751466c104905374a929cf4f84b61cabf61ad
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: "postgres://authenticator:${AUTHENTICATOR_DB_PASSWORD}@db:5432/postgres"
      PGRST_DB_SCHEMAS: "${PGRST_DB_SCHEMAS:-public,storage,graphql_public}"
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "${JWT_SECRET:?required}"
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 20
  storage:
    image: supabase/storage-api:v1.60.4@sha256:b751c6872eb688a10a4706608f2f310f7fdb7d50c725086328cb22a9d90ec7de
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      rest: {condition: service_healthy}
    environment:
      ANON_KEY: "${ANON_KEY:?required}"
      SERVICE_KEY: "${SERVICE_ROLE_KEY:?required}"
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: "${JWT_SECRET:?required}"
      DATABASE_URL: "postgres://supabase_storage_admin:${SUPABASE_STORAGE_ADMIN_PASSWORD}@db:5432/postgres"
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20
  api-gateway:
    image: nginx:1.29.1-alpine@sha256:94f1c83ea210e0568f87884517b4fe9a39c74b6ac74ce0e63e0e1354b4c8a6e9
    restart: unless-stopped
    depends_on:
      auth: {condition: service_healthy}
      rest: {condition: service_healthy}
      storage: {condition: service_healthy}
    ports:
      - "127.0.0.1:${API_PORT:?required}:8000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  db-data:
  storage-data:
